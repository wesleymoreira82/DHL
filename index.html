<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Rastreio & Enviando</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">

    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        
        h3 { color: #d40511; margin-top: 0; margin-bottom: 15px; }
        
        label { display: block; text-align: left; font-size: 14px; color: #555; margin-bottom: 5px; font-weight: bold; }
        
        input { padding: 12px; width: 90%; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; font-size: 16px; outline: none; }
        input:focus { border-color: #d40511; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        
        button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 15px; width: 100%; color: white; }
        button:hover { opacity: 0.9; }

        /* NOVO BOTÃO: Rastreio Instituto Hesed (Marrom para Creme/Bege) */
        .btn-hesed {
            background: linear-gradient(90deg, #6F4E37 0%, #E6C280 100%);
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4); /* Sombra para o texto ler bem no lado claro */
        }

        /* Botão Original (DHL/Drive) */
        .btn-master { 
            background: linear-gradient(90deg, #007bff 0%, #d40511 100%); 
        }

        /* Botão Novo (Enviando) */
        .btn-enviando {
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
        }

        /* Botão Power BI */
        .btn-powerbi {
            background: linear-gradient(90deg, #F2C811 0%, #D49000 100%);
            color: #333; /* Texto escuro para contrastar com o amarelo */
        }

        hr { border: 0; border-top: 1px solid #eee; margin: 10px 0 20px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Gestão de Pedidos</h3>

        <label>Consultar Pedido (Shopify):</label>
        <input type="text" id="pedidoHesed" placeholder="Ex: 12345" onkeypress="handleKeyPress(event, 'hesed')">
        
        <div class="btn-group">
            <button class="btn-hesed" onclick="pesquisarHesed()">Rastrear Pedido</button>
        </div>

        <hr>

        <label>Bling ou NF (DHL):</label>
        <input type="text" id="info" placeholder="Ex: 12345" onkeypress="handleKeyPress(event, 'pedido')">
        
        <div class="btn-group">
            <button class="btn-master" onclick="pesquisarTudo()">Rastrear Pedido DHL</button>
        </div>

        <hr>

        <label>Consultar CPF (Enviando):</label>
        <input type="text" id="cpfInfo" placeholder="Apenas números" onkeypress="handleKeyPress(event, 'cpf')">

        <div class="btn-group" style="margin-bottom: 0;">
            <button class="btn-enviando" onclick="pesquisarEnviando()">Buscar no Enviando</button>
        </div>

        <hr>

        <label>Power BI (Planilha):</label>
        <input type="text" id="pbiInfo" placeholder="Digite o número" onkeypress="handleKeyPress(event, 'powerbi')">

        <div class="btn-group" style="margin-bottom: 0;">
            <button class="btn-powerbi" onclick="pesquisarPowerBI()">Buscar na Planilha</button>
        </div>
    </div>

    <script>
        // --- FUNÇÃO NOVA: Rastreio Instituto Hesed ---
        function pesquisarHesed() {
            const valor = document.getElementById('pedidoHesed').value.trim();
            
            if (valor) {
                const urlHesed = `https://rastreio.institutohesed.org.br/rastreio/${valor}`;
                window.open(urlHesed, '_blank');
                document.getElementById('pedidoHesed').value = ''; 
            } else {
                alert("Por favor, digite o número do pedido.");
            }
        }

        // --- FUNÇÃO 1: Rastreio DHL + Drive ---
        function pesquisarTudo() {
            const valor = document.getElementById('info').value.trim();
            
            if (valor) {
                const urlNF = `https://drive.google.com/drive/search?q=${valor}`;
                const urlRastreio = `https://mysctrackandtrace.dhl.com/order/public/detail?id=55002009OMS%2F${valor}-CID271068-BR_5111&indexType=CURRENT&country=BR&activeTab=orderHistory`;

                window.open(urlNF, '_blank');
                window.open(urlRastreio, '_blank');

                document.getElementById('info').value = ''; 
            } else {
                alert("Por favor, digite o código do pedido (DHL/NF).");
            }
        }

        // --- FUNÇÃO 2: Busca no Enviando (CPF) ---
        function pesquisarEnviando() {
            let cpf = document.getElementById('cpfInfo').value.trim();

            if (cpf) {
                cpf = cpf.replace(/\D/g, ''); 

                const urlEnviando = `https://hesed.enviando.nordware.io/orders/search/?order=&order_source_number=&invoice_number=&order_status_alt=&order_priority=&account=&store=&shipping_type_id=&order_date_gte=&order_date_lte=&integrated_at_gte=&integrated_at_lte=&invoice_authorized_at_gte=&invoice_authorized_at_lte=&send_to_separate_gte=&send_to_separate_lte=&dispatch_at_gte=&dispatch_at_lte=&tracking_code=&shipping_name=&client_document=${cpf}&postal_code=&item_code=&item_gtin=&item_serial=&batch=`;

                window.open(urlEnviando, '_blank');
                
                document.getElementById('cpfInfo').value = ''; 
            } else {
                alert("Por favor, digite o CPF do cliente.");
            }
        }

        // --- FUNÇÃO 3: Busca no Power BI (Google Sheets) ---
        function pesquisarPowerBI() {
            const valor = document.getElementById('pbiInfo').value.trim();

            if (valor) {
                const urlPlanilha = `https://docs.google.com/spreadsheets/d/1liP1pYvB4BsZ-J_DXnIWLHMOPeZ6jx24f_DjR7mking/edit?gid=1407160955#gid=1407160955`;

                navigator.clipboard.writeText(valor).then(() => {
                    alert(`Número ${valor} copiado! Ao abrir a planilha, aperte Ctrl+F e cole para achar a linha.`);
                });

                window.open(urlPlanilha, '_blank');
                document.getElementById('pbiInfo').value = ''; 
            } else {
                alert("Por favor, digite o número para buscar no Power BI/Planilha.");
            }
        }

        // --- CONTROLE DE TECLA ENTER ---
        function handleKeyPress(e, tipo) {
            if (e.key === 'Enter') {
                if (tipo === 'hesed') {
                    pesquisarHesed(); // Aciona a busca do Hesed
                } else if (tipo === 'pedido') {
                    pesquisarTudo();
                } else if (tipo === 'cpf') {
                    pesquisarEnviando();
                } else if (tipo === 'powerbi') {
                    pesquisarPowerBI(); 
                }
            }
        }
    </script>

</body>
</html>
